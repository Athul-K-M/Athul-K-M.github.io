<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Admin | Athul KM</title>
<style>
:root{--bg:#080b09;--surface:#101510;--accent:#b5ff6d;--text:#f3f5ef;--muted:#a0a89e;--border:rgba(181,255,109,.18)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 Arial,sans-serif}.wrap{width:min(100% - 32px,1000px);margin:32px auto}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}h1 span{color:var(--accent)}h2{margin-top:0}.muted,small{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;margin:18px 0}
label{display:block;color:var(--muted);font-size:13px;margin:12px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:7px;background:#080b09;color:var(--text);font:inherit}textarea{min-height:75px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{padding:10px 15px;border:1px solid var(--border);border-radius:7px;background:var(--accent);color:#080b09;font-weight:bold;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{background:transparent;color:var(--text)}.tabs button.selected{background:var(--accent);color:#080b09}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.entry{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--border);padding:14px 0}.entry small{display:block}.delete{background:#672d2d;color:white}.edit{background:transparent;color:var(--accent)}.notice{background:#182018;color:var(--accent);padding:12px;border-radius:8px;white-space:pre-wrap}.hidden{display:none!important}a{color:var(--accent);text-decoration:none}
@media(max-width:650px){.row{grid-template-columns:1fr}.entry{align-items:flex-start;flex-direction:column}.panel{padding:16px}header{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap">
<header><div><p class="muted">ATHUL KM · PRIVATE AREA</p><h1>Portfolio <span>Dashboard.</span></h1></div><a href="./index.html">View public portfolio ↗</a></header>
<p id="notice" class="notice">Set up Supabase as described in README.md before signing in.</p>
<section id="loginPanel" class="panel"><h2>Administrator Login</h2><p class="muted">Sign in using the admin account you create in Supabase.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><div class="actions"><button>Sign in</button></div></form></section>
<section id="dashboard" class="panel hidden"><div class="actions"><b id="userEmail"></b><button id="logout" type="button">Sign out</button></div>
<div class="tabs"><button data-tab="certificates" class="selected">Certificates</button><button data-tab="skills">Skills</button><button data-tab="achievements">Achievements</button></div>
<div id="certificatesPanel"><h2>Manage certificates</h2><form id="certForm"><input type="hidden" id="certId"><div class="row"><div><label>Certificate title *</label><input id="certTitle" required></div><div><label>Issuing organization *</label><input id="certIssuer" required></div></div><div class="row"><div><label>Completion date / period</label><input id="certDate" placeholder="January–February 2026"></div><div><label>Course duration</label><input id="certDuration" placeholder="4 weeks"></div></div><div class="row"><div><label>Score / grade</label><input id="certScore"></div><div><label>Recommended credits</label><input id="certCredits"></div></div><label>Description</label><textarea id="certDescription"></textarea><label>Certificate PDF or image (optional when editing)</label><input id="certFile" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp"><label>Verification URL (optional)</label><input id="certVerification" type="url" placeholder="https://..."><div class="actions"><button>Save certificate</button><button id="clearCert" type="button">Clear</button></div></form><div id="certList"></div></div>
<div id="skillsPanel" class="hidden"><h2>Manage skills</h2><form id="skillForm"><input type="hidden" id="skillId"><div class="row"><div><label>Skill name *</label><input id="skillName" required></div><div><label>Category</label><select id="skillCategory"><option>Programming Languages</option><option>Web Technologies</option><option>Databases</option><option>Tools and Technologies</option><option>Other</option></select></div></div><label>Description</label><input id="skillDescription"><div class="actions"><button>Save skill</button><button id="clearSkill" type="button">Clear</button></div></form><div id="skillList"></div></div>
<div id="achievementsPanel" class="hidden"><h2>Manage achievements</h2><form id="achievementForm"><input type="hidden" id="achievementId"><label>Achievement title *</label><input id="achievementTitle" required><label>Date</label><input id="achievementDate" type="date"><label>Description</label><textarea id="achievementDescription"></textarea><label>Supporting file (optional)</label><input id="achievementFile" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp"><div class="actions"><button>Save achievement</button><button id="clearAchievement" type="button">Clear</button></div></form><div id="achievementList"></div></div>
</section></main><script type="module" src="./js/admin.js"></script></body></html>
